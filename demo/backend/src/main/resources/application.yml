
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/eventfriends
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate          # Flyway ????????? ??????, Hibernate ?????? ????????? [citation:12]
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true     # ???? ?? ??? ? ??????? [citation:6]

server:
  port: 8080
  servlet:
    context-path: /api            # ??? ????????? ? /api